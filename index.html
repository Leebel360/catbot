<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Battle Bulls Game</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDK များကို အစဉ်လိုက်ထားရှိခြင်း -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --bg-color: #a0a0a0;
            --card-bg: #1c2e64;
            --accent-blue: #007bff;
            --gold: #f1c40f;
            --text-white: #ffffff;
            --text-gray: #0b1a45;
        }

        body, html {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', sans-serif;
            background-color: #000;
            color: var(--text-white);
            height: 100%;
            width: 100%;
            overflow: hidden; /* Screen အပြင်ထွက်မသွားစေရန် */
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 450px;
            height: 100dvh; /* GitHub/Mobile အတွက် Dynamic Height */
            background: linear-gradient(to bottom, #0b1a45, #000000);
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden; 
        }

        /* Header */
        .header { padding: 15px; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }

        /* Stats Grid */
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; padding: 10px 15px; flex-shrink: 0; }
        .stat-box { background-color: var(--card-bg); padding: 10px; border-radius: 12px; text-align: center; font-size: 11px; }
        .stat-label { color: #88c0f7; margin-bottom: 5px; }
        .stat-value { font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 4px; font-size: 14px; }

        /* Views (Pages) */
        .view {
            display: none;
            flex: 1;
            overflow-y: auto;
            padding: 10px 15px 90px 15px; /* အောက်ခြေ Nav အတွက် padding ပေးထားသည် */
        }
        .view.active { display: block; }

        /* Balance & Rank */
        .balance-section { text-align: center; margin-top: 15px; }
        .balance-amount { font-size: 45px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .rank-bar-container { padding: 10px 40px; font-size: 13px; }
        .progress-bg { background: #111; height: 12px; border-radius: 10px; margin: 5px 0; border: 1px solid #333; overflow: hidden; }
        .progress-fill { background: linear-gradient(to right, #f1c40f, #e67e22); width: 0%; height: 100%; transition: width 0.3s; }

        /* Character Area */
        .character-area { display: flex; justify-content: center; align-items: center; padding: 20px 0; }
        .character-circle {
            width: 260px; height: 260px;
            background: radial-gradient(circle, #3498db, #0b1a45);
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; transition: transform 0.1s;
            border: 4px solid rgba(255,255,255,0.1);
            position: relative;
        }
        .character-circle:active { transform: scale(0.95); }
        .bull-img { width: 75%; height: 75%; object-fit: contain; }

        /* Earn/Friends Style */
        .earn-tabs { display: flex; margin-bottom: 20px; background: rgba(0,0,0,0.3); border-radius: 12px; padding: 4px; }
        .earn-tab { flex: 1; text-align: center; padding: 10px; color: var(--text-gray); cursor: pointer; font-weight: 600; border-radius: 10px; }
        .earn-tab.active { color: white; background: #1c2e64; }
        .category-title { color: var(--text-gray); margin: 20px 0 12px 5px; font-size: 15px; }
        .task-card { background: #1c2e64; padding: 14px 18px; border-radius: 18px; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; border: 1px solid rgba(255,255,255,0.03); }
        .task-info { display: flex; align-items: center; gap: 15px; }
        .task-icon { width: 45px; height: 45px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; color: #fff; }
        .daily-icon { background: #2c3e50; } .yt-icon { background: #c0392b; } .friend-icon { background: #1e3799; }
        .reward-val { color: var(--gold); font-size: 13px; font-weight: 700; margin-top: 3px; display: block; }

        /* Bottom Nav */
        .bottom-nav {
            position: absolute; bottom: 0; width: 100%; height: 75px;
            background-color: #050a24; display: flex; justify-content: space-around; align-items: center;
            border-top: 1px solid #1c2e64; z-index: 1000;
        }
        .nav-item { text-align: center; font-size: 11px; color: var(--text-gray); cursor: pointer; flex: 1; }
        .nav-item.active { color: #4facfe; }
        .nav-item i { font-size: 22px; margin-bottom: 4px; }

        /* Admin Dashboard */
        #admin-panel {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #0b1a45; z-index: 9999; padding: 20px; box-sizing: border-box; overflow-y: auto; color: white;
        }
        .admin-input { width: 100%; padding: 12px; margin-bottom: 10px; background: #050a24; border: 1px solid #1c2e64; color: white; border-radius: 8px; }
        .admin-btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-bottom: 10px; }
        .tap-anim { position: absolute; color: white; font-weight: bold; font-size: 26px; pointer-events: none; animation: floatUp 0.8s ease-out forwards; }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-100px); } }
    </style>
</head>
<body>

<div class="app-container">
    
    <div class="header" onclick="checkAdmin()">
        <i class="fas fa-times"></i>
        <strong>Battle Bulls</strong>
        <i class="fas fa-ellipsis-v"></i>
    </div>

    <!-- HOME VIEW -->
    <div id="home" class="view active">
        <div class="stats-grid">
            <div class="stat-box">
                <div class="stat-label">Earn per tap</div>
                <div class="stat-value" style="color: #f1c40f;">$ +1</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Earn per hour</div>
                <div class="stat-value" style="color: #f1c40f;">$ +0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label" style="color: #2ecc71;">Energy</div>
                <div class="stat-value"><i class="fas fa-bolt" style="color: #f1c40f;"></i> 1,000/1,000</div>
            </div>
        </div>

        <div class="balance-section">
            <div class="balance-amount">
                <i class="fa-solid fa-circle-dollar-to-slot" style="color: #f1c40f;"></i>
                <span id="balance">0</span>
            </div>
            <div class="rank-bar-container">
                <div style="display: flex; justify-content: space-between;">
                    <span>Rank Progress</span>
                    <span style="color: var(--gold);"><span id="current-rank">0</span> / 2,500</span>
                </div>
                <div class="progress-bg"><div class="progress-fill" id="progress"></div></div>
            </div>
        </div>

        <div class="character-area">
            <div class="character-circle" onclick="handleTap(event)">
                <img src="https://cdn-icons-png.flaticon.com/512/616/616430.png" class="bull-img" alt="Cat">
            </div>
        </div>
    </div>

    <!-- EARN VIEW -->
    <div id="earn" class="view">
        <div style="text-align: center; padding: 20px 0;">
            <i class="fa-solid fa-circle-euro" style="font-size: 60px; color: #f1c40f;"></i>
            <h1 style="color: yellow; font-size: 24px;">အမှတ်များများ ရယူပါ</h1>
        </div>
        <div class="earn-tabs">
            <div class="earn-tab active">Tasks</div>
            <div class="earn-tab">Completed</div>
        </div>
        <div class="list-container" id="user-task-list">
            <!-- Dynamic Tasks from Firebase will appear here -->
        </div>
    </div>

    <!-- FRIENDS VIEW -->
    <div id="friends" class="view">
        <div style="text-align: center; padding: 20px 0;">
            <h1>Invite friends</h1>
            <p style="color: var(--text-gray);">Receive bonuses for each friend</p>
        </div>
        <div class="task-card">
            <div class="task-info">
                <div class="task-icon friend-icon"><i class="fas fa-gift"></i></div>
                <div class="task-text"><p>Invite a friend</p><span class="reward-val">$ +5,000</span></div>
            </div>
        </div>
        <button class="admin-btn" style="background: var(--accent-blue); margin-top: 20px;">Invite a friend</button>
    </div>

    <!-- BOTTOM NAV -->
    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('home', this)">
            <i class="fas fa-house"></i><div>Home</div>
        </div>
        <div class="nav-item" onclick="switchTab('earn', this)">
            <i class="fas fa-wallet"></i><div>Earn</div>
        </div>
        <div class="nav-item" onclick="switchTab('friends', this)">
            <i class="fas fa-user-group"></i><div>Friends</div>
        </div>
    </div>
</div>

<!-- ADMIN DASHBOARD -->
<div id="admin-panel">
    <h2>Admin Dashboard</h2>
    <input type="text" id="task-title" class="admin-input" placeholder="Task Title">
    <input type="text" id="task-link" class="admin-input" placeholder="URL Link">
    <input type="number" id="task-reward" class="admin-input" placeholder="Reward Coins">
    <select id="task-category" class="admin-input">
        <option value="daily">Daily Tasks</option>
        <option value="more">More to do</option>
    </select>
    <button class="admin-btn" style="background: #2ecc71;" onclick="addNewTask()">Add Task</button>
    <button class="admin-btn" style="background: #e74c3c;" onclick="document.getElementById('admin-panel').style.display='none'">Close</button>
    <div id="admin-task-list"></div>
</div>

<script>
    // Global Variables - အပေါ်ဆုံးမှာ ထားပေးရပါမယ်
    var clickCount = 0;
    let balance = 0;
    const targetRank = 2500;
    const adminEmail = "aungzawhtayaungzawhtay517@gmail.com";

    // Firebase Config
    const firebaseConfig = {
        apiKey: "AIzaSyBnbb6yZSSkwToT380tNnGVPApYkEpOido",
        authDomain: "catbot-75a29.firebaseapp.com",
        projectId: "catbot-75a29",
        storageBucket: "catbot-75a29.firebasestorage.app",
        messagingSenderId: "52987376674",
        appId: "1:52987376674:web:2c542dc2656afd16cc067b"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // Home Tap Logic
    function handleTap(event) {
        if (balance < targetRank) {
            balance += 1;
            document.getElementById('balance').innerText = balance.toLocaleString();
            document.getElementById('current-rank').innerText = balance.toLocaleString();
            document.getElementById('progress').style.width = (balance / targetRank * 100) + "%";
            
            const x = event.clientX || event.touches[0].clientX;
            const y = event.clientY || event.touches[0].clientY;
            const anim = document.createElement('div');
            anim.className = 'tap-anim';
            anim.innerText = '+1';
            anim.style.left = (x - 10) + 'px';
            anim.style.top = (y - 20) + 'px';
            document.body.appendChild(anim);
            setTimeout(() => anim.remove(), 800);
        }
    }

    // Navigation Switch
    function switchTab(tabId, el) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        el.classList.add('active');
    }

    // Admin Access via Redirect (Popup blocked fix)
    function checkAdmin() {
        clickCount++;
        if (clickCount >= 5) {
            clickCount = 0;
            const provider = new firebase.auth.GoogleAuthProvider();
            firebase.auth().signInWithRedirect(provider);
        }
    }

    // စာမျက်နှာပြန်ပွင့်လာလျှင် Admin ဖြစ်မဖြစ် စစ်ဆေးခြင်း
    firebase.auth().getRedirectResult().then((result) => {
        if (result.user && result.user.email === adminEmail) {
            document.getElementById('admin-panel').style.display = 'block';
            renderAdminTasks();
        } else if (result.user) {
            alert("Unauthorized Account.");
            firebase.auth().signOut();
        }
    });

    // Firebase Task Real-time Listener
    db.collection("tasks").orderBy("createdAt", "desc").onSnapshot((snapshot) => {
        const container = document.getElementById('user-task-list');
        let html = '';
        snapshot.forEach((doc) => {
            const t = doc.data();
            html += `
                <div class="task-card" onclick="window.open('${t.link}', '_blank')">
                    <div class="task-info">
                        <div class="task-icon yt-icon"><i class="fas fa-play"></i></div>
                        <div class="task-text"><p>${t.title}</p><span class="reward-val">$ +${t.reward.toLocaleString()}</span></div>
                    </div>
                    <i class="fas fa-chevron-right"></i>
                </div>`;
        });
        container.innerHTML = html;
    });

    async function addNewTask() {
        const title = document.getElementById('task-title').value;
        const link = document.getElementById('task-link').value;
        const reward = document.getElementById('task-reward').value;
        const cat = document.getElementById('task-category').value;
        if(title && link && reward) {
            await db.collection("tasks").add({ title, link, reward: parseInt(reward), cat, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
            alert("Task Added!");
        }
    }

    function renderAdminTasks() {
        db.collection("tasks").onSnapshot(snapshot => {
            const list = document.getElementById('admin-task-list');
            list.innerHTML = '<h3>Existing Tasks:</h3>';
            snapshot.forEach(doc => {
                const t = doc.data();
                list.innerHTML += `<div style="background:#1c2e64; padding:10px; margin-bottom:5px; border-radius:8px; display:flex; justify-content:space-between;">
                    <span>${t.title}</span>
                    <button onclick="deleteTask('${doc.id}')" style="background:red; color:white; border:none; border-radius:4px;">Delete</button>
                </div>`;
            });
        });
    }

    async function deleteTask(id) {
        if(confirm("Delete task?")) await db.collection("tasks").doc(id).delete();
    }
</script>

</body>
</html>
